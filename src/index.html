  <!-- Aplica el tema antes de pintar para que no haya destello claro/oscuro -->
  <script>
    (function () {
      // Marca que hay JS: solo entonces se ocultan los elementos que aparecen al hacer scroll
      document.documentElement.classList.add('js');
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('app-dark');
    })();
  </script>
